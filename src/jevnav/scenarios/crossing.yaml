world:
  height: 12
  width: 12
  step_time: 0.1
  sample_time: 0.1
  offset: [0, 0]
  collision_mode: 'stop'
  control_mode: 'auto'

robot:
  - kinematics: {name: 'diff'}
    shape: {name: 'circle', radius: 0.2}
    state: [1, 1, 0.785]
    goal: [11, 11, 0]
    goal_threshold: 0.3
    vel_max: [0.25, 0.7854]
    vel_min: [-0.25, -0.7854]
    sensors:
      - name: 'lidar2d'
        range_min: 0
        range_max: 5
        angle_range: 6.2832
        number: 180
        noise: False
        plot:
          alpha: 0.15
    plot:
      show_trajectory: True
      traj_width: 0.04
      traj_alpha: 0.9
      show_goal: True

obstacle:
  - shape: {name: 'rectangle', length: 1.2, width: 2.4}
    state: [3.5, 8.5, 0]
  - shape: {name: 'rectangle', length: 2.4, width: 1.2}
    state: [8.5, 3.5, 0]
  - number: 3
    kinematics: {name: 'omni'}
    distribution: {name: 'random', range_low: [4, 4, -3.14], range_high: [8, 8, 3.14]}
    behavior: {name: 'rvo', wander: True, range_low: [3, 3, -3.14], range_high: [9, 9, 3.14], vxmax: 0.15, vymax: 0.15, factor: 1.0}
    vel_max: [0.15, 0.15]
    vel_min: [-0.15, -0.15]
    shape: {name: 'circle', radius: 0.3}
  - shape: {name: 'linestring', vertices: [[0, 0], [12, 0], [12, 12], [0, 12], [0, 0]]}
    state: [0, 0, 0]
