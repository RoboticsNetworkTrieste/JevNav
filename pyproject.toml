[project]
name = "jevnav"
version = "0.1.0"
description = "A Jev-style System One model drives an ir-sim mobile robot to its goal"
readme = "README.md"
license = "Apache-2.0"
requires-python = ">=3.11"
dependencies = ["ir-sim", "numpy", "scipy", "shapely>=2.1.2"]

[project.scripts]
jevnav = "jevnav.cli:main"

[tool.uv.sources]
ir-sim = { path = "external/ir-sim", editable = true }

[dependency-groups]
dev = ["pytest>=8.4", "ruff>=0.12"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/jevnav"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
extend-exclude = ["external"]

[tool.ruff.lint]
select = ["F", "E", "W", "I", "UP", "B", "RUF", "C4", "SIM", "RET"]
